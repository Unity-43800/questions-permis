<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Vérifications Permis B</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Syne:wght@700;800&display=swap');

  :root {
    --bleu:    #1A3B6E;
    --bleu-vif:#2563EB;
    --rouge:   #DC2626;
    --vert:    #16A34A;
    --orange:  #D97706;
    --bg:      #F0F4FA;
    --card:    #FFFFFF;
    --border:  #D1DCF0;
    --texte:   #111827;
    --gris:    #6B7280;
    --tag-vi:  #EFF6FF;
    --tag-vi-t:#1D4ED8;
    --tag-ve:  #F0FDF4;
    --tag-ve-t:#15803D;
    --tag-qs:  #FFF7ED;
    --tag-qs-t:#C2410C;
    --tag-1s:  #FDF4FF;
    --tag-1s-t:#7E22CE;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--texte);
    min-height: 100vh;
  }

  /* ── Header ── */
  header {
    background: var(--bleu);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,.2);
  }
  .logo-rf {
    font-family: 'Syne', sans-serif;
    font-size: 11px;
    font-weight: 700;
    color: white;
    line-height: 1.2;
    border-left: 3px solid #EF4444;
    padding-left: 8px;
    text-transform: uppercase;
    letter-spacing: .04em;
  }
  header h1 {
    font-family: 'Syne', sans-serif;
    font-size: 18px;
    font-weight: 800;
    color: white;
    margin-left: auto;
    text-transform: uppercase;
    letter-spacing: .06em;
  }
  .compteur {
    background: rgba(255,255,255,.15);
    color: white;
    font-size: 13px;
    font-weight: 600;
    padding: 6px 14px;
    border-radius: 20px;
    white-space: nowrap;
  }

  /* ── Filtres ── */
  #filtres {
    display: flex;
    gap: 8px;
    padding: 16px 24px;
    flex-wrap: wrap;
    background: var(--card);
    border-bottom: 1px solid var(--border);
  }
  #filtres button {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    padding: 6px 14px;
    border-radius: 20px;
    border: 1.5px solid transparent;
    cursor: pointer;
    transition: all .15s;
  }
  #filtres button.all  { background: var(--bleu); color: white; border-color: var(--bleu); }
  #filtres button.vi   { background: var(--tag-vi); color: var(--tag-vi-t); border-color: #BFDBFE; }
  #filtres button.ve   { background: var(--tag-ve); color: var(--tag-ve-t); border-color: #BBF7D0; }
  #filtres button.qser { background: var(--tag-qs); color: var(--tag-qs-t); border-color: #FED7AA; }
  #filtres button.s1   { background: var(--tag-1s); color: var(--tag-1s-t); border-color: #E9D5FF; }
  #filtres button.active { box-shadow: 0 0 0 2px currentColor; }
  #filtres button:hover { filter: brightness(.92); }

  .filtre-label {
    font-size: 12px;
    color: var(--gris);
    display: flex;
    align-items: center;
    margin-left: auto;
  }

  /* ── Layout principal ── */
  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 24px 16px 80px;
  }

  /* ── Carte question ── */
  .carte {
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 16px;
    transition: box-shadow .2s;
  }
  .carte:hover { box-shadow: 0 4px 20px rgba(26,59,110,.1); }

  .carte-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 18px 12px;
    border-bottom: 1px solid var(--border);
  }
  .num {
    font-family: 'Syne', sans-serif;
    font-size: 22px;
    font-weight: 800;
    color: var(--bleu);
    min-width: 36px;
  }
  .tag {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .05em;
    padding: 3px 9px;
    border-radius: 20px;
  }
  .tag.VI   { background: var(--tag-vi); color: var(--tag-vi-t); }
  .tag.VE   { background: var(--tag-ve); color: var(--tag-ve-t); }
  .tag.QSER { background: var(--tag-qs); color: var(--tag-qs-t); }
  .tag.S1   { background: var(--tag-1s); color: var(--tag-1s-t); }

  .tag-label { font-size: 12px; color: var(--gris); }

  .carte-body {
    padding: 16px 18px;
  }
  .question-text {
    font-size: 15px;
    font-weight: 600;
    line-height: 1.55;
    color: var(--texte);
    margin-bottom: 14px;
  }

  /* ── Bouton Voir réponse ── */
  .btn-voir {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--bleu-vif);
    background: #EFF6FF;
    border: 1.5px solid #BFDBFE;
    border-radius: 8px;
    padding: 8px 16px;
    cursor: pointer;
    transition: all .15s;
    width: 100%;
    text-align: left;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .btn-voir:hover { background: #DBEAFE; }
  .btn-voir .chevron {
    margin-left: auto;
    transition: transform .25s;
    font-size: 16px;
  }
  .btn-voir.open .chevron { transform: rotate(180deg); }

  /* ── Réponse ── */
  .reponse {
    display: none;
    background: #F8FAFF;
    border: 1.5px solid #BFDBFE;
    border-radius: 8px;
    margin-top: 10px;
    padding: 14px 16px;
    font-size: 14px;
    line-height: 1.6;
    color: #1E3A6E;
    animation: fadeIn .2s ease;
  }
  .reponse.visible { display: block; }
  .reponse ul { padding-left: 20px; }
  .reponse li { margin-bottom: 4px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── Boutons auto-éval ── */
  .auto-eval {
    display: none;
    gap: 8px;
    margin-top: 10px;
  }
  .auto-eval.visible { display: flex; }
  .btn-eval {
    flex: 1;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    padding: 9px 12px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    transition: all .15s;
  }
  .btn-eval.ok   { background: #DCFCE7; color: #166534; }
  .btn-eval.ok:hover   { background: #BBF7D0; }
  .btn-eval.nope { background: #FEE2E2; color: #991B1B; }
  .btn-eval.nope:hover { background: #FECACA; }

  /* ── Résultat badge ── */
  .result-badge {
    display: none;
    font-size: 12px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 20px;
    margin-left: auto;
  }
  .result-badge.ok   { background: #DCFCE7; color: #166534; display: inline-block; }
  .result-badge.nope { background: #FEE2E2; color: #991B1B; display: inline-block; }

  /* ── Barre de progression ── */
  #barre-wrap {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 10px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 12px;
    color: var(--gris);
    font-weight: 500;
  }
  #barre {
    flex: 1;
    height: 6px;
    background: #E5E7EB;
    border-radius: 10px;
    overflow: hidden;
  }
  #barre-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--bleu-vif), #16A34A);
    border-radius: 10px;
    transition: width .4s ease;
  }
  #score-txt { font-weight: 700; color: var(--vert); }

  /* ── Stats bulle ── */
  #stats {
    display: flex;
    gap: 8px;
    padding: 12px 24px;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    flex-wrap: wrap;
  }
  .stat-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    background: #F9FAFB;
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 12px;
    font-weight: 500;
  }
  .stat-pill .dot { width: 8px; height: 8px; border-radius: 50%; }
  .dot-vert { background: var(--vert); }
  .dot-rouge { background: var(--rouge); }
  .dot-gris { background: #D1D5DB; }

  /* ── Reset btn ── */
  #btn-reset {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--gris);
    background: none;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 6px 14px;
    cursor: pointer;
    margin-left: auto;
  }
  #btn-reset:hover { background: #F3F4F6; }

  /* ── Aucun résultat ── */
  #vide {
    display: none;
    text-align: center;
    padding: 60px 20px;
    color: var(--gris);
    font-size: 15px;
  }

  @media (max-width: 480px) {
    header h1 { font-size: 14px; }
    .num { font-size: 18px; }
    .question-text { font-size: 14px; }
  }
</style>
</head>

  { id:38, cat:"VE",   q:"A l'aide de la plaque indicative, donnez la pression préconisée pour les pneumatiques arrières, véhicule chargé.", r:"Lire la valeur indiquée sur la plaque (souvent dans l'encadrement de la portière conducteur)." },
  { id:40, cat:"VE",   q:"Vérifiez le fonctionnement de l'éclairage de la plaque d'immatriculation à l'arrière.", r:"Allumer les feux de position et vérifier que la plaque arrière est bien éclairée. Signaler toute anomalie." },
  { id:41, cat:"VE",   q:"Vérifiez la présence de l'attestation d'assurance et de sa vignette sur le pare-brise.", r:"Vérifier la présence de l'attestation d'assurance et que la vignette est apposée au pare-brise." },
  { id:42, cat:"VE",   q:"Indiquez où se situe la sécurité enfant sur l'une des portières arrière.", r:"Mécanisme situé sur le bord de la portière arrière, accessible portière ouverte." },
  { id:44, cat:"VE",   q:"Avec l'assistance de l'accompagnateur, contrôlez l'état, la propreté et le fonctionnement du ou des feux de recul.", r:"Passer la marche arrière et vérifier feux blancs propres, en bon état et fonctionnels." },
  { id:46, cat:"VE",   q:"Avec l'assistance de l'accompagnateur, contrôlez l'état, la propreté et le fonctionnement des feux de stop.", r:"Appuyer sur la pédale de frein et vérifier les feux stop propres, en bon état et fonctionnels." },
  { id:48, cat:"VE",   q:"Ouvrez et refermez le capot, puis vérifiez sa bonne fermeture.", r:"Fermer le capot, tirer la gâchette, vérifier que le capot est bien verrouillé en appuyant dessus." },
  { id:52, cat:"VE",   q:"Vérifiez l'état, la propreté et le fonctionnement des feux diurnes.", r:"Vérifier propreté, bon état et fonctionnement des DRL. Signaler toute anomalie." },
  { id:54, cat:"VE",   q:"Vérifiez la présence du triangle de pré-signalisation.", r:"Indiquer où il se trouve dans le véhicule (coffre généralement)." },
  { id:56, cat:"VE",   q:"Montrez où s'effectue le changement d'une ampoule à l'avant du véhicule.", r:"Ouvrir le capot et montrer l'accès aux douilles de phares avant." },
  { id:58, cat:"VE",   q:"Montrez où s'effectue le changement d'une ampoule à l'arrière du véhicule.", r:"Montrer l'accès aux feux arrière (depuis le coffre ou l'aile arrière selon le véhicule)." },
  { id:60, cat:"VE",   q:"Ouvrez et refermez le coffre, puis vérifiez sa bonne fermeture.", r:"Vérifier que le coffre est bien verrouillé (ne pas oublier le hayon ou le couvercle)." },
  { id:64, cat:"VE",   q:"Procédez à l'ouverture du capot puis à sa fermeture en vous assurant de son verrouillage.", r:"Tirer la commande d'ouverture, soulever le capot, appuyer sur la sécurité, refermer et vérifier le verrouillage." },
  { id:66, cat:"VE",   q:"Montrez où se situent les gicleurs de lave-glace avant.", r:"Petites buses sur le capot ou sur la grille, orientées vers le bas du pare-brise." },
  { id:70, cat:"VE",   q:"Montrez où s'effectue le contrôle du niveau du liquide de frein (répétition).", r:"Réservoir semi-transparent sous le capot côté conducteur, niveau entre mini et maxi." },
  { id:72, cat:"VE",   q:"Montrez où s'effectue le remplissage du liquide de refroidissement (répétition).", r:"Bocal sous le capot avec symbole thermomètre, vérifier à froid." },
  { id:76, cat:"VE",   q:"Contrôlez l'état, la propreté et le fonctionnement des feux de détresse à l'avant et à l'arrière (répétition).", r:"Allumer les feux de détresse et vérifier les 4 feux clignotants." },
  { id:78, cat:"VE",   q:"Contrôlez l'état, la propreté et le fonctionnement des feux de route (répétition).", r:"Vérifier propreté, bon état et fonctionnement des feux de route." },
  { id:80, cat:"VE",   q:"Montrez où doit s'effectuer le contrôle du niveau d'huile moteur (répétition).", r:"Jauge à huile sous le capot. Moteur froid, véhicule sur terrain plat." },
  { id:86, cat:"VE",   q:"A l'aide de la plaque indicative, donnez la pression préconisée pour les pneus arrières, véhicule chargé (répétition).", r:"Lire la valeur sur la plaque dans le montant de portière." },
  { id:88, cat:"VE",   q:"Indiquez où se situe la sécurité enfant sur l'une des portières arrière (répétition).", r:"Bouton ou glissière sur la tranche de la portière arrière." },
  { id:90, cat:"VE",   q:"Avec l'assistance de l'accompagnateur, contrôlez l'état, la propreté et le fonctionnement des feux de stop (répétition).", r:"Frein appuyé : vérifier les feux stop propres, en bon état et fonctionnels." },
  { id:92, cat:"VE",   q:"Vérifiez l'état, la propreté et le fonctionnement des feux diurnes (répétition).", r:"Vérifier propreté, bon état et fonctionnement. Signaler toute anomalie." },
  { id:96, cat:"VE",   q:"Montrez où s'effectue le changement d'une ampoule à l'avant du véhicule (répétition).", r:"Ouvrir le capot, accéder à l'arrière du bloc optique." },
  { id:99, cat:"VE",   q:"Montrez où se situent les gicleurs de lave-glace avant (répétition).", r:"Buses sur le capot ou la grille, orientées vers le bas du pare-brise." },

  // ── QSER ────────────────────────────────────────────────────────────────
  { id:1,  cat:"QSER", q:"Pourquoi doit-on régler la hauteur des feux ?", r:"Pour ne pas éblouir les autres usagers." },
  { id:2,  cat:"QSER", q:"Pourquoi est-il préférable d'utiliser un liquide lave-glace spécial en hiver ?", r:"Pour éviter le gel du liquide." },
  { id:3,  cat:"QSER", q:"Quel est l'intérêt de la position nuit du rétroviseur intérieur ?", r:"Ne pas être ébloui par les feux du véhicule suiveur." },
  { id:4,  cat:"QSER", q:"Citez un endroit où l'on peut trouver les pressions préconisées pour les pneumatiques.", r:"Sur une plaque dans une portière, dans la notice du véhicule, ou au niveau de la trappe à carburant." },
  { id:5,  cat:"QSER", q:"Comment détecter l'usure des essuie-glaces en circulation ?", r:"En cas de pluie, lorsqu'ils laissent des traces sur le pare-brise." },
  { id:6,  cat:"QSER", q:"Quelles sont les précautions à prendre en cas d'installation d'un porte-vélo ?", r:"La plaque d'immatriculation et les feux doivent rester visibles." },
  { id:7,  cat:"QSER", q:"En cas de panne ou d'accident, quel autre accessoire de sécurité est obligatoire (avec le gilet) ?", r:"Le triangle de pré-signalisation." },
  { id:8,  cat:"QSER", q:"Quelle est la conséquence d'un niveau insuffisant du liquide de frein ?", r:"Une perte d'efficacité du freinage." },
  { id:9,  cat:"QSER", q:"Quels sont les deux autres documents obligatoires à présenter en cas de contrôle (avec la carte grise) ?", r:"L'attestation d'assurance et le permis de conduire." },
  { id:10, cat:"QSER", q:"Quel est le risque de circuler avec des balais d'essuie-glace défectueux ?", r:"Une mauvaise visibilité en cas d'intempéries." },
  { id:11, cat:"QSER", q:"Quelles sont les précautions à prendre lors du remplissage du réservoir ?", r:"Arrêter le moteur, ne pas fumer, ne pas téléphoner." },
  { id:12, cat:"QSER", q:"Quel est le danger si l'on complète le niveau du liquide de refroidissement quand le moteur est chaud ?", r:"Un risque de brûlure." },
  { id:13, cat:"QSER", q:"Quelle peut être la conséquence d'une panne de dégivrage de la lunette arrière ?", r:"Une insuffisance ou une absence de visibilité vers l'arrière." },
  { id:14, cat:"QSER", q:"Quelle est la signification d'un clignotement plus rapide ?", r:"Non-fonctionnement de l'une des ampoules." },
  { id:15, cat:"QSER", q:"Quelles sont les conditions à respecter pour contrôler le niveau d'huile ?", r:"Moteur froid et sur un terrain plat." },
  { id:16, cat:"QSER", q:"Dans quels cas utilise-t-on les feux de brouillard arrière ?", r:"Par temps de brouillard et de neige." },
  { id:17, cat:"QSER", q:"À partir de quel taux d'alcoolémie, en période de permis probatoire, est-on en infraction ?", r:"0,2 g/l — soit 0 verre, car dès le 1er verre ce seuil peut être dépassé." },
  { id:18, cat:"QSER", q:"Dans quels cas doit-on utiliser les feux de détresse ?", r:"En cas de panne, d'accident ou de ralentissement important." },
  { id:19, cat:"QSER", q:"Pourquoi est-il important de bien régler son volant ? Citez deux exemples.", r:"Confort de conduite, accessibilité aux commandes, visibilité du tableau de bord, efficacité des airbags." },
  { id:20, cat:"QSER", q:"Citez un cas d'utilisation de l'appel lumineux.", r:"Pour avertir de son approche, en cas de danger, ou à la place de l'avertisseur sonore." },
  { id:21, cat:"QSER", q:"Citez deux éléments complémentaires permettant un désembuage efficace.", r:"La commande de vitesse de ventilation, la commande d'air chaud, ou la climatisation." },
  { id:22, cat:"QSER", q:"Quel est le principal risque d'un manque d'huile moteur ?", r:"Un risque de détérioration ou de casse du moteur." },
  { id:23, cat:"QSER", q:"Qu'est-ce qui peut provoquer la décharge de la batterie, moteur éteint ?", r:"Les feux ou accessoires électriques laissés en fonctionnement." },
  { id:24, cat:"QSER", q:"Quelle est la solution en cas de panne de batterie pour démarrer sans déplacer le véhicule ?", r:"Brancher une deuxième batterie en parallèle (+ avec + et − avec −) ou la remplacer." },
  { id:25, cat:"QSER", q:"Quel est le risque de circuler avec un frein de parking mal desserré ?", r:"Une dégradation du système de freinage." },
  { id:26, cat:"QSER", q:"Quelles sont les conséquences d'un mauvais réglage des feux de croisement ?", r:"Une mauvaise vision vers l'avant et un risque d'éblouissement des autres usagers." },
  { id:27, cat:"QSER", q:"Quelle est la conséquence d'une température trop élevée du liquide de refroidissement ?", r:"Une surchauffe ou une casse moteur." },
  { id:28, cat:"QSER", q:"Quelle est l'utilité des dispositifs réfléchissants ?", r:"Rendre le véhicule visible la nuit." },
  { id:29, cat:"QSER", q:"Quelle précaution dois-je prendre pour que les enfants à l'arrière ne puissent pas ouvrir leur portière ?", r:"Actionner la sécurité enfant sur les deux portières arrière." },
  { id:30, cat:"QSER", q:"Par temps clair, à quelle distance les feux de position doivent-ils être visibles ?", r:"À 150 mètres." },
  { id:31, cat:"QSER", q:"Quand utilise-t-on les feux de détresse ?", r:"En cas de panne, d'accident ou de ralentissement important." },
  { id:32, cat:"QSER", q:"Qu'est-ce que l'aquaplanage et quelle peut être sa conséquence ?", r:"La présence d'un film d'eau entre le pneu et la chaussée pouvant entraîner une perte de contrôle." },
  { id:33, cat:"QSER", q:"Sans actionner la commande du régulateur, comment le désactiver rapidement ?", r:"En appuyant sur la pédale de frein ou d'embrayage." },
  { id:34, cat:"QSER", q:"Quelles sont les précautions à prendre lors du remplissage du réservoir (répétition) ?", r:"Arrêter le moteur, ne pas fumer, ne pas téléphoner." },
  { id:35, cat:"QSER", q:"Dans quel cas peut-on utiliser l'avertisseur sonore en agglomération ?", r:"En cas de danger immédiat." },
  { id:36, cat:"QSER", q:"Quel est le risque d'un manque d'huile moteur ?", r:"Un risque de détérioration ou de casse du moteur." },
  { id:37, cat:"QSER", q:"Dans quelle situation doit-on désactiver l'airbag passager avant ?", r:"Lors du transport d'un enfant à l'avant dans un siège auto dos à la route." },
  { id:38, cat:"QSER", q:"À quelle fréquence est-il préconisé de vérifier la pression des pneus ?", r:"Chaque mois pour une utilisation normale, et avant chaque long trajet." },
  { id:39, cat:"QSER", q:"En règle générale, à partir de quel âge un enfant peut-il être installé sur le siège passager avant ?", r:"À partir de 10 ans." },
  { id:40, cat:"QSER", q:"Un défaut d'éclairage de la plaque lors du contrôle technique entraîne-t-il une contre-visite ?", r:"Oui." },
  { id:41, cat:"QSER", q:"Quels sont les deux autres documents obligatoires à présenter (avec l'attestation d'assurance) ?", r:"Le certificat d'immatriculation et le permis de conduire." },
  { id:42, cat:"QSER", q:"Si la sécurité enfant est enclenchée, est-il possible d'ouvrir la portière arrière depuis l'extérieur ?", r:"Oui." },
  { id:43, cat:"QSER", q:"Peut-on utiliser les feux de brouillard arrière par forte pluie ?", r:"Non." },
  { id:44, cat:"QSER", q:"Quelles sont les deux utilités des feux de recul ?", r:"Éclairer la zone de recul la nuit et avertir les autres usagers de la manœuvre." },
  { id:45, cat:"QSER", q:"Quelle est l'utilité de l'appui-tête ?", r:"Retenir le mouvement de la tête en cas de choc et limiter les blessures." },
  { id:46, cat:"QSER", q:"Quelle est la conséquence en cas de panne des feux de stop ?", r:"Un manque d'information pour les usagers suiveurs et un risque de collision." },
  { id:47, cat:"QSER", q:"Quelle est la différence entre un voyant orange et un voyant rouge ?", r:"Rouge : anomalie de fonctionnement ou danger. Orange : élément important à surveiller." },
  { id:48, cat:"QSER", q:"En roulant, quel est le risque d'une mauvaise fermeture du capot ?", r:"Un risque d'ouverture du capot pouvant entraîner un accident." },
  { id:49, cat:"QSER", q:"Quel peut être le risque de maintenir le recyclage de l'air de manière prolongée ?", r:"Un risque de mauvaise visibilité par apparition de buée sur les surfaces vitrées." },
  { id:50, cat:"QSER", q:"Quel est le principal risque d'une absence de liquide lave-glace ?", r:"Une mauvaise visibilité." },
  { id:51, cat:"QSER", q:"Quel est le risque de maintenir les feux de route lors d'un croisement ?", r:"Un risque d'éblouissement des autres usagers." },
  { id:52, cat:"QSER", q:"Quelle est l'utilité des feux diurnes ?", r:"Rendre le véhicule plus visible le jour." },
  { id:53, cat:"QSER", q:"En cas d'accident, dans quel délai le constat amiable doit-il être transmis à l'assureur ?", r:"Dans les 5 jours." },
  { id:54, cat:"QSER", q:"Utilise-t-on le triangle de pré-signalisation sur autoroute ?", r:"Non." },
  { id:55, cat:"QSER", q:"Quel est le risque de circuler avec un frein de parking mal desserré (répétition) ?", r:"Une dégradation du système de freinage." },
  { id:56, cat:"QSER", q:"Quelles sont les conséquences en cas de panne d'un feu de croisement ?", r:"Une mauvaise visibilité et le risque d'être confondu avec un deux-roues." },
  { id:57, cat:"QSER", q:"Quelle est l'utilité d'un limiteur de vitesse ?", r:"Ne pas dépasser la vitesse programmée par le conducteur." },
  { id:58, cat:"QSER", q:"Quelles sont les conséquences en cas de panne d'un feu de position arrière ?", r:"Être mal vu et risque de collision." },
  { id:59, cat:"QSER", q:"Pour une bonne visibilité arrière par temps de pluie, en plus de l'essuie-glace, quelle commande actionner ?", r:"La commande de désembuage (dégivrage) arrière." },
  { id:60, cat:"QSER", q:"En transportant un poids important dans le coffre, quelles précautions pour les pneus et l'éclairage avant ?", r:"Augmenter la pression des pneumatiques et régler la hauteur des feux avant." },
  { id:61, cat:"QSER", q:"Peut-on fixer tous les sièges enfant sur des attaches Isofix ?", r:"Non, uniquement ceux compatibles avec ce type d'attache." },
  { id:62, cat:"QSER", q:"Quels sont les risques de circuler avec des objets sur la plage arrière ?", r:"Mauvaise visibilité vers l'arrière et risque de projection en cas de freinage brusque." },
  { id:63, cat:"QSER", q:"À quelle fréquence est-il préconisé de vérifier la pression d'air des pneumatiques ?", r:"Tous les mois." },
  { id:64, cat:"QSER", q:"Pour un capot s'ouvrant depuis l'avant, quelle est l'utilité du dispositif de sécurité ?", r:"Empêcher l'ouverture du capot en circulation en cas de mauvais verrouillage." },
  { id:65, cat:"QSER", q:"Quelle est la principale conséquence d'un dispositif de lave-glace défaillant ?", r:"Une mauvaise visibilité due à l'impossibilité de nettoyer le pare-brise." },
  { id:66, cat:"QSER", q:"Quelle est la principale conséquence d'un lave-glace défaillant (répétition) ?", r:"Une mauvaise visibilité due à l'impossibilité de nettoyer le pare-brise." },
  { id:67, cat:"QSER", q:"Quel est l'intérêt de la position nuit du rétroviseur (répétition) ?", r:"Ne pas être ébloui par les feux du véhicule suiveur." },
  { id:68, cat:"QSER", q:"Citez un endroit où trouver les pressions préconisées pour les pneus (répétition).", r:"Plaque dans la portière, notice du véhicule, ou trappe à carburant." },
  { id:69, cat:"QSER", q:"Comment détecter l'usure des essuie-glaces en circulation (répétition) ?", r:"En cas de pluie, lorsqu'ils laissent des traces sur le pare-brise." },
  { id:70, cat:"QSER", q:"Quelle est la conséquence d'un niveau insuffisant du liquide de frein (répétition) ?", r:"Une perte d'efficacité du freinage." },
  { id:71, cat:"QSER", q:"En cas de panne ou d'accident, quel accessoire de sécurité est obligatoire (hors gilet) ?", r:"Le triangle de pré-signalisation." },
  { id:73, cat:"QSER", q:"Quelle peut être la conséquence d'une panne de dégivrage de la lunette arrière (répétition) ?", r:"L'insuffisance ou l'absence de visibilité vers l'arrière." },
  { id:74, cat:"QSER", q:"Quelle est la signification d'un clignotement plus rapide (répétition) ?", r:"Non-fonctionnement de l'une des ampoules." },
  { id:80, cat:"QSER", q:"Quel est le principal risque d'un manque d'huile moteur (répétition) ?", r:"Un risque de détérioration ou de casse du moteur." },
  { id:82, cat:"QSER", q:"Quelles sont les conséquences d'un mauvais réglage des feux de croisement (répétition) ?", r:"Mauvaise vision vers l'avant et risque d'éblouissement des autres usagers." },
  { id:83, cat:"QSER", q:"Quelle est la conséquence d'une température trop élevée du liquide de refroidissement (répétition) ?", r:"La surchauffe ou la casse moteur." },
  { id:86, cat:"QSER", q:"À quelle fréquence vérifier la pression des pneus (répétition) ?", r:"Chaque mois et avant chaque long trajet." },
  { id:87, cat:"QSER", q:"Dans quelle situation désactiver l'airbag passager (répétition) ?", r:"Lors du transport d'un enfant dans un siège auto dos à la route." },
  { id:88, cat:"QSER", q:"Si la sécurité enfant est enclenchée, peut-on ouvrir la portière depuis l'extérieur (répétition) ?", r:"Oui." },
  { id:89, cat:"QSER", q:"À partir de quel âge un enfant peut-il s'asseoir à l'avant (répétition) ?", r:"À partir de 10 ans." },
  { id:90, cat:"QSER", q:"Quelle est la conséquence en cas de panne des feux de stop (répétition) ?", r:"Manque d'information pour les usagers suiveurs et risque de collision." },
  { id:91, cat:"QSER", q:"Peut-on utiliser les feux de brouillard arrière par forte pluie (répétition) ?", r:"Non." },
  { id:92, cat:"QSER", q:"Quelle est l'utilité des feux diurnes (répétition) ?", r:"Rendre le véhicule plus visible le jour." },
  { id:93, cat:"QSER", q:"Quel peut être le risque de maintenir le recyclage de l'air de manière prolongée (répétition) ?", r:"Risque de mauvaise visibilité par apparition de buée." },
  { id:95, cat:"QSER", q:"Quel est le risque de maintenir les feux de route lors d'un croisement (répétition) ?", r:"Un risque d'éblouissement des autres usagers." },
  { id:96, cat:"QSER", q:"Quelles sont les conséquences en cas de panne d'un feu de croisement (répétition) ?", r:"Mauvaise visibilité et risque d'être confondu avec un deux-roues." },

  // ── 1ers secours ────────────────────────────────────────────────────────
  { id:1,  cat:"S1",   q:"Comment et pourquoi protéger une zone de danger en cas d'accident de la route ?", r:"En délimitant clairement et largement la zone de danger de façon visible, pour protéger les victimes et éviter un sur-accident." },
  { id:2,  cat:"S1",   q:"Quels comportements adopter en cas de diffusion du signal d'alerte du SAIP ?", r:"• Se mettre en sécurité.\n• S'informer via les médias et sites des autorités.\n• Respecter les consignes des autorités." },
  { id:3,  cat:"S1",   q:"Comment est composé le signal d'alerte SAIP diffusé par les sirènes ?", r:"Deux codes distincts :\n• Le Signal National d'Alerte (SNA) : variation du signal sur trois cycles successifs.\n• Le signal de fin d'alerte : signal continu." },
  { id:4,  cat:"S1",   q:"Sur autoroute, comment indiquer avec précision les lieux de l'accident depuis un téléphone portable ?", r:"En indiquant le numéro de l'autoroute, le sens de circulation et le point kilométrique." },
  { id:5,  cat:"S1",   q:"Comment vérifier la respiration d'une victime ?", r:"Regarder si le ventre et la poitrine se soulèvent et sentir de l'air à l'expiration (pendant 10 secondes)." },
  { id:6,  cat:"S1",   q:"Qu'est-ce qu'une perte de connaissance ?", r:"C'est lorsque la victime ne répond pas et ne réagit pas, mais respire." },
  { id:7,  cat:"S1",   q:"Si un dégagement d'urgence de la victime est nécessaire, où doit-elle être déplacée ?", r:"Dans un endroit suffisamment éloigné du danger et de ses conséquences." },
  { id:8,  cat:"S1",   q:"En cas de panne ou d'accident, quel équipement de sécurité doit être porté avant de quitter le véhicule ?", r:"Le gilet de haute visibilité (gilet jaune) avant de sortir du véhicule." },
  { id:9,  cat:"S1",   q:"Pourquoi l'alerte auprès des services de secours doit-elle être rapide et précise ?", r:"Pour permettre aux services de secours d'apporter les moyens adaptés aux victimes dans le délai le plus court." },
  { id:10, cat:"S1",   q:"Quels sont les numéros d'urgence à composer ?", r:"• 18 : sapeurs-pompiers\n• 15 : SAMU\n• 112 : numéro d'urgence européen" },
  { id:11, cat:"S1",   q:"Quels comportements adopter en présence d'une victime inconsciente qui respire ?", r:"• La placer en Position Latérale de Sécurité (PLS).\n• Alerter les secours.\n• Surveiller la respiration jusqu'à l'arrivée des secours." },
  { id:12, cat:"S1",   q:"Comment arrêter une hémorragie ?", r:"En appuyant fortement sur l'endroit qui saigne avec les doigts ou la paume de la main, en mettant un tissu propre sur la plaie." },

// Dédoublonnage et état
let etat = {}; // uid => 'ok' | 'nope'
let filtreCourant = 'all';

function uid(q) { return q.cat + '-' + q.id + '-' + questions.indexOf(q); }

function filtrer(cat) {
  filtreCourant = cat;
  document.querySelectorAll('#filtres button').forEach(b => b.classList.remove('active'));
  const map = { all:'all', VI:'vi', VE:'ve', QSER:'qser', S1:'s1' };
  document.querySelector('.' + (map[cat] || cat)).classList.add('active');
  rendreListe();
}

function rendreListe() {
  const main = document.getElementById('main');
  main.innerHTML = '';
  const vide = document.getElementById('vide');

  const liste = filtreCourant === 'all'
    ? questions
    : questions.filter(q => q.cat === filtreCourant);

  if (liste.length === 0) { vide.style.display = 'block'; updateStats(); return; }
  vide.style.display = 'none';

  const labelsCat = { VI:'Vérification Intérieure', VE:'Vérification Extérieure', QSER:'Sécurité Routière', S1:'Premiers Secours' };

  liste.forEach((q, idx) => {
    const id = uid(q);
    const r = etat[id];
    const carte = document.createElement('div');
    carte.className = 'carte';
    carte.id = 'carte-' + id.replace(/[^a-z0-9]/gi,'-');

    const reponseFormatee = q.r
      .split('\n')
      .map(l => l.startsWith('•') ? `<li>${l.slice(1).trim()}</li>` : `<p>${l}</p>`)
      .join('');
    const hasLi = q.r.includes('\n•') || q.r.startsWith('•');

    carte.innerHTML = `
      <div class="carte-header">
        <span class="num">${String(q.id).padStart(2,'0')}</span>
        <span class="tag ${q.cat}">${q.cat === 'S1' ? '1ers secours' : q.cat}</span>
        <span class="tag-label">${labelsCat[q.cat]}</span>
        <span class="result-badge ${r || ''}">${r === 'ok' ? '✓ Su' : r === 'nope' ? '✗ À revoir' : ''}</span>
      </div>
      <div class="carte-body">
        <div class="question-text">${q.q}</div>
        <button class="btn-voir" id="btn-${id.replace(/[^a-z0-9]/gi,'-')}" onclick="toggleRep(this, '${id.replace(/[^a-z0-9]/gi,'-')}')">
          <span>👁 Voir la réponse</span>
          <span class="chevron">▾</span>
        </button>
        <div class="reponse" id="rep-${id.replace(/[^a-z0-9]/gi,'-')}">
          ${hasLi ? '<ul>' + reponseFormatee + '</ul>' : reponseFormatee}
        </div>
        <div class="auto-eval" id="eval-${id.replace(/[^a-z0-9]/gi,'-')}">
          <button class="btn-eval ok"   onclick="noter('${id}','ok')">  ✓ Je savais</button>
          <button class="btn-eval nope" onclick="noter('${id}','nope')">✗ À revoir</button>
        </div>
      </div>`;
    main.appendChild(carte);
  });

  document.getElementById('cpt').textContent = liste.length + ' questions';
  updateStats();
}

function toggleRep(btn, safeid) {
  const rep  = document.getElementById('rep-'  + safeid);
  const eval_ = document.getElementById('eval-' + safeid);
  const open = rep.classList.toggle('visible');
  btn.classList.toggle('open', open);
  btn.querySelector('span:first-child').textContent = open ? '🙈 Masquer' : '👁 Voir la réponse';
  if (open) eval_.classList.add('visible');
}

function noter(id, val) {
  etat[id] = val;
  updateStats();
  // Mettre à jour le badge sans re-render complet
  const safeid = id.replace(/[^a-z0-9]/gi,'-');
  const badge = document.querySelector('#carte-' + safeid + ' .result-badge');
  if (badge) {
    badge.className = 'result-badge ' + val;
    badge.textContent = val === 'ok' ? '✓ Su' : '✗ À revoir';
  }
}

function updateStats() {
  const liste = filtreCourant === 'all'
    ? questions
    : questions.filter(q => q.cat === filtreCourant);

  const total = liste.length;
  const ok    = liste.filter(q => etat[uid(q)] === 'ok').length;
  const nope  = liste.filter(q => etat[uid(q)] === 'nope').length;
  const rest  = total - ok - nope;

  document.getElementById('s-ok').textContent   = ok   + ' correcte' + (ok   > 1 ? 's' : '');
  document.getElementById('s-nope').textContent  = nope + ' à retravailler';
  document.getElementById('s-rest').textContent  = rest + ' restante' + (rest > 1 ? 's' : '');
  document.getElementById('score-txt').textContent = ok + ' / ' + total;
  document.getElementById('barre-fill').style.width = total ? (ok / total * 100) + '%' : '0%';
}

function resetTout() {
  if (!confirm('Réinitialiser toutes les évaluations ?')) return;
  etat = {};
  rendreListe();
}

// Init
rendreListe();
</script>
